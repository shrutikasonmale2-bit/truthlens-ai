<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TruthLens AI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div id="toast" class="toast-message" style="display:none;"></div>

  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="glass-card" style="width: 100%; max-width: 420px; text-align: center;">
      <h2 style="margin-bottom: 0.5rem;">Welcome Back</h2>
      <p style="color: var(--text-sub); margin-bottom: 2rem;">Sign in to TruthLens AI</p>
      
      <form id="login-form">
        <div class="form-group" style="text-align: left;">
          <label>Email Address</label>
          <input type="email" id="login-email" class="form-control" required placeholder="name@example.com">
        </div>

        <div class="form-group" style="text-align: left; position: relative;">
          <label>Password</label>
          <div style="position: relative;">
            <input type="password" id="login-password" class="form-control" required placeholder="••••••••" style="padding-right: 45px;">
            <span id="toggle-password-login" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-sub); font-size: 1.1rem;">👁️</span>
          </div>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
      </form>

      <div style="margin: 1.5rem 0; color: var(--text-sub); font-size: 0.9rem;">OR</div>

      <button id="google-btn" class="btn-primary" style="width: 100%; background: rgba(255,255,255,0.08); border: 1px solid var(--border-color);">
        Sign in with Google
      </button>

      <p style="margin-top: 1.5rem; color: var(--text-sub); font-size: 0.9rem;">
        New user? <a href="register.html" style="color: #7c3aed; text-decoration: none; font-weight: 600;">Register First</a>
      </p>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
