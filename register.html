<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - TruthLens AI</title>
  <link rel="stylesheet" href="style.css?v=1">
  <link rel="stylesheet" href="dashboard.css?v=1">
</head>
<body>
  <div id="toast" class="toast-message" style="display:none;"></div>

  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="glass-card" style="width: 100%; max-width: 420px; text-align: center;">
      <h2 style="margin-bottom: 0.5rem;">Create Account</h2>
      <p style="color: var(--text-sub); margin-bottom: 2rem;">Start analyzing content authenticity</p>
      
      <form id="register-form">
        <div class="form-group" style="text-align: left;">
          <label>Full Name</label>
          <input type="text" id="reg-name" class="form-control" required placeholder="John Doe">
        </div>

        <div class="form-group" style="text-align: left;">
          <label>Email Address</label>
          <input type="email" id="reg-email" class="form-control" required placeholder="name@example.com">
        </div>

        <div class="form-group" style="text-align: left; position: relative;">
          <label>Password</label>
          <div style="position: relative;">
            <input type="password" id="reg-password" class="form-control" required placeholder="••••••••" style="padding-right: 45px;">
            <span id="toggle-password-reg" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-sub); font-size: 1.1rem;">👁️</span>
          </div>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Register Account</button>
      </form>

      <p style="margin-top: 1.5rem; color: var(--text-sub); font-size: 0.9rem;">
        Already registered? <a href="login.html" style="color: #7c3aed; text-decoration: none; font-weight: 600;">Login</a>
      </p>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
  <script src="theme-loader.js"></script>

</body>
</html>
