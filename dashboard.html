<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - TruthLens AI</title>
  <link rel="stylesheet" href="style.css?v=1">
  <link rel="stylesheet" href="dashboard.css?v=1">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="logo">TruthLens AI</div>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="analyze.html">Analyze Content</a>
      <a href="history.html">History</a>
      <a href="report.html">Reports</a>
      <a href="profile.html">Profile</a>
      <a href="settings.html">Settings</a>
    </aside>

    <main class="main-content">
      <h2>Welcome Back</h2>
      <p style="color: var(--text-sub); margin-bottom: 2rem;">Overview of your digital trust metrics.</p>

      <div class="metric-grid">
        <div class="glass-card metric-card">
          <h4>Total Analyzed</h4>
          <h3 id="stat-total">0</h3>
        </div>
        <div class="glass-card metric-card">
          <h4>High Trust</h4>
          <h3 id="stat-safe">0</h3>
        </div>
        <div class="glass-card metric-card">
          <h4>Suspicious Content</h4>
          <h3 id="stat-risky">0</h3>
        </div>
      </div>

      <div class="glass-card">
        <h3>Quick Scan</h3>
        <p style="color: var(--text-sub); margin-bottom: 1rem;">Directly jump to content evaluation tool.</p>
        <a href="analyze.html" class="btn-primary">Start New Analysis</a>
      </div>
    </main>
  </div>

  <script type="module">
    // Path बदलून थेट './firebase.js' केली आहे (कारण js फोल्डर नाहीये)
    import { auth, db, collection, getDocs, query, where, onAuthStateChanged } from './firebase.js';

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      try {
        const q = query(collection(db, 'analyses'), where('userId', '==', user.uid));
        const querySnapshot = await getDocs(q);

        let totalCount = querySnapshot.size;
        let safeCount = 0;
        let riskyCount = 0;

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const score = data.result?.trust_score ?? data.result?.score ?? data.trust_score ?? data.score ?? 0;

          if (score >= 70) {
            safeCount++;
          } else if (score < 40) {
            riskyCount++;
          }
        });

        document.getElementById('stat-total').textContent = totalCount;
        document.getElementById('stat-safe').textContent = safeCount;
        document.getElementById('stat-risky').textContent = riskyCount;

      } catch (error) {
        console.error("Dashboard metrics load error:", error);
      }
    });
  </script>
</body>
</html>
