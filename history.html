<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analysis History - TruthLens AI</title>
  <link rel="stylesheet" href="style.css?v=1">
  <link rel="stylesheet" href="dashboard.css?v=1">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="logo">TruthLens AI</div>
      <a href="dashboard.html">Dashboard</a>
      <a href="analyze.html">Analyze Content</a>
      <a href="history.html" class="active">History</a>
      <a href="report.html">Reports</a>
      <a href="profile.html">Profile</a>
      <a href="settings.html">Settings</a>
    </aside>

    <main class="main-content">
      <h2>Scan History</h2>
      <p style="color: var(--text-sub); margin-bottom: 2rem;">Log of previous AI validations stored on Firestore.</p>

      <div class="glass-card" style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; text-align: left;">
          <thead>
            <tr style="border-bottom: 1px solid var(--border-color); color: var(--text-sub);">
              <th style="padding: 1rem;">Type</th>
              <th style="padding: 1rem;">Content Snippet</th>
              <th style="padding: 1rem;">Trust Score</th>
              <th style="padding: 1rem;">Risk Level</th>
              <th style="padding: 1rem;">Action</th>
            </tr>
          </thead>
          <tbody id="history-table-body">
            <tr>
              <td colspan="5" style="padding: 1.5rem; text-align: center; color: var(--text-sub);">
                Loading history...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module">
    // Firestore imports directly through ./firebase.js
    import { auth, db, collection, getDocs, query, where, onAuthStateChanged, doc, deleteDoc } from './firebase.js';

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        alert('Please log in first!');
        window.location.href = 'login.html';
        return;
      }

      const tbody = document.getElementById('history-table-body');
      if (!tbody) return;

      try {
        console.log("Fetching history for User ID:", user.uid);

        const q = query(collection(db, 'analyses'), where('userId', '==', user.uid));
        const querySnapshot = await getDocs(q);
        
        console.log("Total records found:", querySnapshot.size);
        tbody.innerHTML = '';
        
        if (querySnapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="5" style="padding: 1.5rem; text-align: center; color: var(--text-sub);">No scan records found.</td></tr>';
          return;
        }

        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const docId = docSnap.id;
          const tr = document.createElement('tr');
          tr.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
          
          const isFake = data.result?.label === 'FAKE' || data.result?.isFake === true || data.isFake === true;
          
          // Dynamic Trust Score Calculation
          const rawScore = data.trustScore ?? data.score ?? data.result?.confidence ?? 0;
          const score = typeof rawScore === 'number' ? rawScore.toFixed(1) : rawScore;

          const riskBadge = isFake 
            ? `<span style="color: #ef4444; font-weight: bold; background: rgba(239, 68, 68, 0.15); padding: 4px 10px; border-radius: 6px; border: 1px solid #ef4444;">HIGH RISK</span>`
            : `<span style="color: #22c55e; font-weight: bold; background: rgba(34, 197, 94, 0.15); padding: 4px 10px; border-radius: 6px; border: 1px solid #22c55e;">LOW RISK</span>`;

          const type = data.contentType || 'Text';
          const snippet = data.contentSnippet || 'No snippet';

          tr.innerHTML = `
            <td style="padding: 1rem; text-transform: capitalize;">${type}</td>
            <td style="padding: 1rem; color: var(--text-sub); max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">"${snippet}"</td>
            <td style="padding: 1rem; font-weight: 600; color: ${isFake ? '#ef4444' : '#22c55e'};">${score}%</td>
            <td style="padding: 1rem;">${riskBadge}</td>
            <td style="padding: 1rem;">
              <button class="delete-btn" data-id="${docId}" style="background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; padding: 6px 12px; border-radius: 6px; cursor: pointer;">Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        });

        // Delete Button Click Listener
        tbody.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const id = e.target.getAttribute('data-id');
            if (confirm('Are you sure you want to delete this scan record?')) {
              try {
                await deleteDoc(doc(db, 'analyses', id));
                e.target.closest('tr').remove();
                if (tbody.children.length === 0) {
                  tbody.innerHTML = '<tr><td colspan="5" style="padding: 1.5rem; text-align: center; color: var(--text-sub);">No scan records found.</td></tr>';
                }
              } catch (err) {
                console.error("Delete error:", err);
                alert("Failed to delete record.");
              }
            }
          });
        });

      } catch (error) {
        console.error("Error fetching history:", error);
        tbody.innerHTML = '<tr><td colspan="5" style="padding: 1.5rem; text-align: center; color: #ef4444;">Failed to load history from Firestore. Check console for details.</td></tr>';
      }
    });
  </script>
</body>
</html>
